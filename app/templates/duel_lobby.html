<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МосGuessr — Лобби</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='tab_icons/duel.ico') }}?v=1" type="image/x-icon">
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #1c2333;
            --border: rgba(255,255,255,0.08);
            --accent: #f0a500;
            --accent2: #e05a2b;
            --text: #e6edf3;
            --muted: #8b949e;
            --green: #3fb950;
            --purple: #9b59b6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(240,165,0,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(240,165,0,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        .container {
            max-width: 460px;
            width: 100%;
            position: relative;
            z-index: 1;
            text-align: center;
        }

        h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 48px;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        h2 span { color: var(--accent2); }

        .lobby-id-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 24px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
            justify-content: space-between;
        }

        .lobby-id-label {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
        }

        .lobby-id-value {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px;
            letter-spacing: 4px;
            color: var(--accent2);
        }

        .copy-btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--muted);
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* 🆕 Стили для выбора режима */
        .mode-selector-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 28px;
            text-align: left;
        }

        .mode-selector-label {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .mode-select {
            width: 100%;
            padding: 12px 16px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 0.2s;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' fill='none' stroke='%238b949e' stroke-width='2' viewBox='0 0 24 24'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 16px center;
        }

        .mode-select:hover {
            border-color: var(--accent);
        }

        .mode-select:focus {
            outline: none;
            border-color: var(--accent2);
        }

        .mode-select option {
            background: var(--surface2);
            color: var(--text);
            padding: 12px;
        }

        /* 🆕 Стили для отображения режима (для не-хоста) */
        .mode-display-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 28px;
            text-align: center;
        }

        .mode-display-label {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .mode-display-value {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .mode-display-value.classic {
            color: var(--accent);
        }

        .mode-display-value.creator {
            color: var(--purple);
        }

        .players-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .player-slot {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s;
        }

        .player-slot.ready {
            border-color: rgba(63,185,80,0.3);
            background: rgba(63,185,80,0.05);
        }

        .player-slot.empty {
            opacity: 0.5;
            border-style: dashed;
        }

        .player-name {
            font-size: 16px;
            font-weight: 600;
        }

        .player-status {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-ready { color: var(--green); }
        .status-waiting { color: var(--muted); }

        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-ready {
            background: var(--green);
            color: #0d1117;
        }

        .btn-ready:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(63,185,80,0.3);
        }

        .btn-ready:disabled {
            background: var(--surface2);
            color: var(--muted);
            cursor: not-allowed;
        }

        .btn-back {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            margin-top: 16px;
        }

        .btn-back:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .status-msg {
            margin-top: 16px;
            font-size: 13px;
            color: var(--accent);
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🏠 <span>Лобби</span></h2>

        <div class="lobby-id-box">
            <div style="text-align: left;">
                <div class="lobby-id-label">Код лобби</div>
                <div class="lobby-id-value" id="lobbyIdDisplay">{{ lobby_id }}</div>
            </div>
            <button class="copy-btn" onclick="copyLobbyLink()">📋 Копировать</button>
        </div>

        <!-- 🆕 Выбор режима (виден только хосту) -->
        <div class="mode-selector-box" id="modeSelectorBox" style="display: none;">
            <div class="mode-selector-label">Режим игры</div>
            <select class="mode-select" id="modeSelect" onchange="changeMode()">
                <option value="classic">⚡ Классическая дуэль</option>
                <option value="creator">🎨 Режим Создатель</option>
            </select>
            <div style="font-size: 11px; color: var(--muted); margin-top: 8px;">
                💡 Вы можете изменить режим в любой момент до начала игры
            </div>
        </div>

        <!-- 🆕 Отображение режима (видно не-хосту) -->
        <div class="mode-display-box" id="modeDisplayBox" style="display: none;">
            <div class="mode-display-label">Режим игры</div>
            <div class="mode-display-value classic" id="modeDisplayValue">
                ⚡ Классическая дуэль
            </div>
        </div>

        <div class="players-list" id="playersList">
            <div class="player-slot empty">
                <span class="player-name">Загрузка...</span>
                <span class="player-status status-waiting">—</span>
            </div>
        </div>

        <button id="readyBtn" class="btn btn-ready" onclick="setReady()" disabled>
            ✅ Готов
        </button>

        <br>
        <a href="/duel" class="btn btn-back">← Назад</a>

        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        // ========================
        // КОНСТАНТЫ ИЗ ШАБЛОНА
        // ========================
        const socket = io();
        const lobbyId = '{{ lobby_id }}';
        const myName = '{{ user.name if user else "Игрок" }}';
        const myUserId = {{ user.id if user else 0 }};

        // 🆕 Состояния
        let isHost = false;
        let currentMode = 'classic';
        let modeChanged = false;  // Флаг, что хост уже выбирал режим

        console.log('==========================================');
        console.log('[LOBBY] Starting lobby page');
        console.log('[LOBBY] lobbyId:', lobbyId);
        console.log('[LOBBY] myName:', myName);
        console.log('[LOBBY] myUserId:', myUserId);
        console.log('==========================================');

        // 🔥 Проверка данных
        if (!myUserId) {
            console.error('[LOBBY] ERROR: myUserId is 0 or undefined!');
            document.getElementById('statusMsg').textContent = '❌ Ошибка: пользователь не авторизован';
        }

        // ========================
        // ПОДКЛЮЧЕНИЕ К ЛОББИ
        // ========================
        console.log('[LOBBY] Emitting join_lobby with:', { lobby_id: lobbyId });
        socket.emit('join_lobby', { lobby_id: lobbyId });

        // ========================
        // ОБРАБОТЧИКИ СОБЫТИЙ
        // ========================

        // 🆕 Обработчик создания лобби (для хоста)
        socket.on('lobby_created', function(data) {
            console.log('[LOBBY] lobby_created received:', data);
            
            if (data.host == myUserId) {
                isHost = true;
                showModeSelector();
            }
            
            if (data.mode) {
                currentMode = data.mode;
                updateModeDisplay();
            }
            
            if (data.players) {
                updatePlayersList(data);
            }
        });

        // Обновление списка игроков
        socket.on('lobby_update', function(data) {
            console.log('[LOBBY] lobby_update received:', data);
            console.log('[LOBBY] Players:', data.players);
            console.log('[LOBBY] Mode:', data.mode);
            
            // 🆕 Определяем, хост ли мы (если ещё не определили)
            if (!modeChanged && data.host == myUserId) {
                isHost = true;
                showModeSelector();
            }
            
            // 🆕 Обновляем режим
            if (data.mode !== undefined) {
                currentMode = data.mode;
                updateModeDisplay();
                
                // Синхронизируем селект с текущим режимом
                const modeSelect = document.getElementById('modeSelect');
                if (modeSelect && modeSelect.value !== currentMode) {
                    modeSelect.value = currentMode;
                }
            }
            
            updatePlayersList(data);
        });

        // 🔥 ДУЭЛЬ НАЙДЕНА
        socket.on('duel_found', function(data) {
            console.log('==========================================');
            console.log('[LOBBY] 🎯 duel_found event received!');
            console.log('[LOBBY] Full data:', data);
            console.log('[LOBBY] duel_id:', data.duel_id);
            console.log('[LOBBY] opponent_name:', data.opponent_name);
            console.log('[LOBBY] my_user_id from event:', data.my_user_id);
            console.log('[LOBBY] mode:', data.mode);
            console.log('==========================================');

            // 🔥 Сохраняем данные
            const duelId = data.duel_id;
            const opponentName = data.opponent_name || 'Соперник';
            const userId = data.my_user_id || myUserId;
            const mode = data.mode || currentMode;  // 🆕 Получаем режим

            console.log('[LOBBY] Preparing to save:');
            console.log('[LOBBY] - duelId:', duelId);
            console.log('[LOBBY] - opponentName:', opponentName);
            console.log('[LOBBY] - userId:', userId);
            console.log('[LOBBY] - mode:', mode);

            if (!duelId) {
                console.error('[LOBBY] ❌ CRITICAL: duel_id is missing!');
                document.getElementById('statusMsg').textContent = '❌ Ошибка: не получен ID дуэли';
                return;
            }

            if (!userId) {
                console.error('[LOBBY] ❌ CRITICAL: user_id is missing!');
                document.getElementById('statusMsg').textContent = '❌ Ошибка: не получен ID пользователя';
                return;
            }

            // 🔥 СОХРАНЯЕМ В sessionStorage
            try {
                sessionStorage.setItem('duel_id', duelId);
                sessionStorage.setItem('opponent_name', opponentName);
                sessionStorage.setItem('my_user_id', userId);
                sessionStorage.setItem('duel_mode', mode);  // 🆕 Сохраняем режим
                sessionStorage.setItem('lobby_id', data.lobby_id || lobbyId);
                
                console.log('[LOBBY] ✅ Data saved to sessionStorage successfully');
            } catch (e) {
                console.error('[LOBBY] ❌ Failed to save to sessionStorage:', e);
                document.getElementById('statusMsg').textContent = '❌ Ошибка сохранения данных';
                return;
            }

            // 🔥 ПРОВЕРЯЕМ ЧТО СОХРАНИЛОСЬ
            console.log('[LOBBY] Verification - saved data:');
            console.log('[LOBBY] - duel_id:', sessionStorage.getItem('duel_id'));
            console.log('[LOBBY] - opponent_name:', sessionStorage.getItem('opponent_name'));
            console.log('[LOBBY] - my_user_id:', sessionStorage.getItem('my_user_id'));
            console.log('[LOBBY] - mode:', sessionStorage.getItem('duel_mode'));

            // 🔥 ПЕРЕХОДИМ НА СТРАНИЦУ ДУЭЛИ в зависимости от режима
            console.log('[LOBBY] ✅ All checks passed, redirecting...');
            document.getElementById('statusMsg').textContent = '✅ Дуэль найдена! Переходим...';

            setTimeout(() => {
                // 🆕 Редирект в зависимости от режима
                const redirectUrl = mode === 'creator' ? '/duel/create/match' : '/duel/match';
                console.log('[LOBBY] 🚀 Redirecting to:', redirectUrl);
                window.location.href = redirectUrl;
            }, 300);
        });

        // Обработка ошибок
        socket.on('error', function(data) {
            console.error('[LOBBY] ❌ Socket error:', data);
            document.getElementById('statusMsg').textContent = '❌ ' + data.message;
        });

        // ========================
        // 🆕 ФУНКЦИИ ДЛЯ РЕЖИМА
        // ========================

        function showModeSelector() {
            console.log('[LOBBY] Showing mode selector (user is host)');
            document.getElementById('modeSelectorBox').style.display = 'block';
            document.getElementById('modeDisplayBox').style.display = 'none';
            document.getElementById('modeSelect').value = currentMode;
        }

        function showModeDisplay() {
            console.log('[LOBBY] Showing mode display (user is not host)');
            document.getElementById('modeSelectorBox').style.display = 'none';
            document.getElementById('modeDisplayBox').style.display = 'block';
        }

        function updateModeDisplay() {
            const modeDisplayValue = document.getElementById('modeDisplayValue');
            
            if (currentMode === 'creator') {
                modeDisplayValue.textContent = '🎨 Режим Создатель';
                modeDisplayValue.className = 'mode-display-value creator';
            } else {
                modeDisplayValue.textContent = '⚡ Классическая дуэль';
                modeDisplayValue.className = 'mode-display-value classic';
            }
            
            // Если не хост, показываем отображение режима
            if (!isHost) {
                showModeDisplay();
            }
        }

        function changeMode() {
            const newMode = document.getElementById('modeSelect').value;
            
            if (newMode === currentMode) {
                return;  // Режим не изменился
            }
            
            console.log('[LOBBY] Changing mode from', currentMode, 'to', newMode);
            
            socket.emit('set_lobby_mode', { 
                lobby_id: lobbyId, 
                mode: newMode 
            });
            
            modeChanged = true;
            currentMode = newMode;
            
            // Показываем уведомление
            const msg = document.getElementById('statusMsg');
            msg.textContent = newMode === 'creator' ? 
                '🎨 Выбран режим Создатель' : 
                '⚡ Выбрана классическая дуэль';
            setTimeout(() => { msg.textContent = ''; }, 2000);
        }

        // ========================
        // ФУНКЦИИ
        // ========================

        function updatePlayersList(data) {
            console.log('[LOBBY] Updating players list');
            const list = document.getElementById('playersList');
            let html = '';

            if (!data.players || data.players.length === 0) {
                html = `<div class="player-slot empty">
                    <span class="player-name">Ожидание игроков...</span>
                    <span class="player-status status-waiting">—</span>
                </div>`;
            } else {
                data.players.forEach(function(p) {
                    const isMe = p.user_id == myUserId;
                    console.log('[LOBBY] Player:', p.name, 'id:', p.user_id, 'ready:', p.ready, 'isMe:', isMe);

                    html += `<div class="player-slot ${p.ready ? 'ready' : ''}">
                        <span class="player-name">${p.name} ${isMe ? '(Вы)' : ''}</span>
                        <span class="player-status ${p.ready ? 'status-ready' : 'status-waiting'}">
                            ${p.ready ? '✅ Готов' : '⏳ Ожидание...'}
                        </span>
                    </div>`;
                });

                // Если только 1 игрок, показываем пустой слот
                if (data.players.length < 2) {
                    html += `<div class="player-slot empty">
                        <span class="player-name">Ожидание соперника...</span>
                        <span class="player-status status-waiting">—</span>
                    </div>`;
                }
            }

            list.innerHTML = html;

            // Кнопка "Готов"
            const readyBtn = document.getElementById('readyBtn');
            if (data.can_rematch) {
                readyBtn.disabled = false;
                readyBtn.textContent = '🔄 Готов к рематчу';
                readyBtn.style.background = 'var(--accent2)';
            } else if (data.players && data.players.length >= 2) {
                readyBtn.disabled = false;
                readyBtn.textContent = '✅ Готов';
                readyBtn.style.background = 'var(--green)';
            } else {
                readyBtn.disabled = true;
                readyBtn.textContent = '✅ Готов';
                readyBtn.style.background = 'var(--surface2)';
            }
        }

        function setReady() {
            console.log('[LOBBY] Setting ready for user:', myUserId);
            socket.emit('player_ready', { lobby_id: lobbyId });

            const readyBtn = document.getElementById('readyBtn');
            readyBtn.disabled = true;
            readyBtn.textContent = 'Ожидание соперника...';
            readyBtn.style.background = 'var(--surface2)';
        }

        function copyLobbyLink() {
            const link = window.location.origin + '/duel/lobby/' + lobbyId;
            console.log('[LOBBY] Copying link:', link);

            navigator.clipboard.writeText(link).then(function() {
                const msg = document.getElementById('statusMsg');
                msg.textContent = '✅ Ссылка скопирована!';
                setTimeout(function() {
                    msg.textContent = '';
                }, 2000);
            }).catch(function() {
                prompt('Скопируйте ссылку:', link);
            });
        }

        // При загрузке страницы
        console.log('[LOBBY] ✅ Page fully loaded, waiting for events...');
    </script>
</body>
</html>
