<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>МосGuessr — Раунд {{ round_number }}/5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #1c2333;
            --border: rgba(255,255,255,0.12);
            --accent: #f0a500;
            --accent2: #e05a2b;
            --text: #e6edf3;
            --muted: #8b949e;
            --green: #3fb950;
            --red: #f85149;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        #pano {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* Кнопка возврата к началу */
        .return-to-start {
            position: fixed;
            bottom: 0;
            right: 0;
            z-index: 250;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-right: none;
            border-bottom: none;
            border-radius: 12px 0 0 0;
            color: var(--accent);
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.3);
        }

        .return-to-start:hover {
            background: var(--surface);
            border-color: var(--accent);
            color: #ffb930;
            padding-right: 28px;
        }

        .return-to-start svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            pointer-events: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .topbar-left { display: flex; align-items: center; gap: 12px; }

        .logo-text {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            letter-spacing: 4px;
            color: var(--text);
        }

        .pill {
            background: rgba(240,165,0,0.15);
            border: 1px solid rgba(240,165,0,0.3);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
        }

        .score-pill {
            background: var(--accent);
            border-radius: 20px;
            padding: 4px 16px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            letter-spacing: 2px;
            color: #0d1117;
        }

        .map-float {
            position: fixed;
            top: 70px;
            right: 24px;
            z-index: 200;
            width: 320px;
            height: 240px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 48px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.03) inset;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .map-float:hover {
            width: 500px;
            height: 400px;
            box-shadow: 0 28px 60px rgba(240, 165, 0, 0.15), 0 0 0 1px rgba(240, 165, 0, 0.2) inset;
        }

        .map-float.collapsed {
            width: 280px;
            height: 52px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .map-float.collapsed:hover {
            width: 280px;
            height: 52px;
        }

        .map-float.collapsed #map,
        .map-float.collapsed .map-float-footer {
            display: none;
        }

        .map-float.collapsed .map-float-hint {
            display: none;
        }

        .map-float.expanded {
            width: 720px;
            height: 520px;
            box-shadow: 0 28px 60px rgba(0,0,0,0.75), 0 0 0 1px rgba(240,165,0,0.12) inset;
        }

        .map-float-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            user-select: none;
        }

        .map-float.collapsed .map-float-header {
            border-bottom: none;
        }

        .map-float-left { display: flex; align-items: center; gap: 10px; }

        .map-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .map-float.collapsed .map-dot { opacity: 1; }

        .map-float-title {
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 600;
        }

        .map-float-hint {
            font-size: 10px;
            color: rgba(139,148,158,0.45);
            transition: opacity 0.4s;
        }

        .map-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .map-collapse-btn,
        .map-expand-btn {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .map-collapse-btn:hover,
        .map-expand-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(240,165,0,0.07);
        }

        .map-float.collapsed .map-collapse-btn {
            display: none;
        }

        .map-container {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .map-overlay-curtain {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: var(--surface2);
            pointer-events: auto;
            z-index: 3;
            border-top: 1px solid var(--border);
        }

        .marker-nav {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            gap: 8px;
            z-index: 2;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .marker-nav.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .marker-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            font-size: 16px;
        }

        .marker-btn:hover {
            transform: scale(1.1);
            border-color: var(--accent);
        }

        .marker-btn.user-marker {
            color: var(--red);
        }

        .marker-btn.user-marker:hover {
            background: rgba(248, 81, 73, 0.15);
            border-color: var(--red);
        }

        .marker-btn.real-marker {
            color: var(--green);
        }

        .marker-btn.real-marker:hover {
            background: rgba(63, 185, 80, 0.15);
            border-color: var(--green);
        }

        .map-float-footer {
            padding: 0 14px;
            height: 64px;
            background: var(--surface2);
            border-top: none;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            z-index: 4;
            margin-top: -12px;
        }

        .btn-guess, .btn-next {
            flex: 0 1 auto;
            min-width: 200px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            transform: translateY(-16px);
        }

        .btn-guess {
            background: var(--accent);
            color: #0d1117;
        }

        .btn-guess:hover:not(:disabled) {
            background: #ffb930;
            transform: translateY(-17px);
            box-shadow: 0 4px 12px rgba(240,165,0,0.3);
        }

        .btn-guess:disabled {
            background: rgba(22,27,34,0.82);
            color: var(--muted);
            border: 1px solid var(--border);
            cursor: not-allowed;
            transform: translateY(-16px);
        }

        .btn-next {
            background: var(--green);
            color: #0d1117;
            display: none;
        }

        .btn-next:hover {
            transform: translateY(-17px);
            opacity: 0.92;
            box-shadow: 0 4px 12px rgba(63,185,80,0.3);
        }

        .btn-next.finish {
            background: var(--accent2);
            box-shadow: 0 4px 12px rgba(224,90,43,0.3);
        }

        .btn-next.visible {
            display: block;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            gap: 18px;
        }

        .loading-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 56px;
            letter-spacing: 6px;
            color: var(--accent);
        }

        .loading-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 56px;
            letter-spacing: 6px;
            color: var(--text);
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--muted);
            text-transform: uppercase;
        }

        .loading-attempt { font-size: 11px; color: rgba(139,148,158,0.4); }

        .result-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.62);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .result-overlay.visible { opacity: 1; pointer-events: auto; }

        .result-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px 32px;
            max-width: 340px;
            width: 100%;
            text-align: center;
            transform: translateY(20px) scale(0.97);
            transition: transform 0.32s cubic-bezier(.4,0,.2,1);
        }

        .result-overlay.visible .result-card { transform: translateY(0) scale(1); }

        .result-emoji { font-size: 44px; margin-bottom: 10px; }

        .result-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 30px;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        .result-score {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 76px;
            color: var(--accent);
            letter-spacing: 4px;
            line-height: 1;
        }

        .result-score-label {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 24px;
        }

        .result-stats {
            display: flex;
            gap: 1px;
            background: var(--border);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .result-stat { flex: 1; background: var(--surface2); padding: 14px 8px; }
        .result-stat-val { font-weight: 700; font-size: 15px; }
        .result-stat-key {
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 3px;
        }

        .result-close-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #0d1117;
            border: none;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
        }

        .result-close-btn:hover { background: #ffb930; }

        .clickable-marker {
            cursor: pointer;
        }

        .clickable-marker:hover {
            filter: brightness(1.2);
            transform: scale(1.1);
            transition: all 0.2s ease;
        }

        @media (max-width: 600px) {
            .map-float {
                top: 70px;
                right: 12px;
                left: 12px;
                width: auto;
                height: 220px;
            }

            .map-float:hover {
                width: auto;
                height: 300px;
            }

            .map-float.collapsed {
                width: auto;
                height: 52px;
            }

            .map-float.expanded {
                top: 70px;
                right: 12px;
                left: 12px;
                width: auto;
                height: 50vh;
            }

            .topbar { padding: 8px 14px; }
            .logo-text { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-logo">Мос<span style="color: var(--accent);">Guessr</span></div>
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">Ищем панораму</div>
        <div class="loading-attempt" id="attemptCounter"></div>
    </div>

    <div class="result-overlay" id="resultOverlay">
        <div class="result-card">
            <div class="result-emoji" id="resultEmoji">🎯</div>
            <div class="result-title" id="resultTitle">ОТЛИЧНО!</div>
            <div class="result-score" id="resultScore">+0</div>
            <div class="result-score-label" id="resultScoreLabel">очков за раунд</div>
            <div class="result-stats">
                <div class="result-stat">
                    <div class="result-stat-val" id="resultDist">—</div>
                    <div class="result-stat-key">Расстояние</div>
                </div>
                <div class="result-stat">
                    <div class="result-stat-val" id="resultAccuracy">—</div>
                    <div class="result-stat-key">Точность</div>
                </div>
            </div>
            <button class="result-close-btn" onclick="closeResult()">Посмотреть на карте</button>
        </div>
    </div>

    <div id="pano"></div>

    <!-- Кнопка возврата к началу -->
    <button class="return-to-start" id="goToStart" title="Вернуться к начальной точке">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8"/>
            <path d="M12 8v8M8 12l4-4 4 4"/>
        </svg>
        Вернуться к началу
    </button>

    <div class="topbar">
        <div class="topbar-left">
            <div class="logo-text">Мос<span style="color: var(--accent);">Guessr</span></div>
            <div class="pill">Раунд {{ round_number }} / 5</div>
        </div>
        <div class="score-pill">🏆 <span id="totalScore">{{ total_score }}</span></div>
    </div>

    <div class="map-float" id="mapFloat">
        <div class="map-float-header">
            <div class="map-float-left">
                <div class="map-dot"></div>
                <div class="map-float-title">Карта Москвы</div>
            </div>
            <div class="map-float-hint" id="mapHint">Кликните, чтобы выбрать место</div>
            <div class="map-controls">
                <button class="map-collapse-btn" id="collapseBtn" title="Свернуть">
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path d="M5 12h14"/>
                    </svg>
                </button>
                <button class="map-expand-btn" id="expandBtn" title="Развернуть">
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="map-container">
            <div id="map"></div>
            <div class="map-overlay-curtain"></div>
            <div class="marker-nav" id="markerNav">
                <button class="marker-btn user-marker" id="goToUserMarker" title="К моей догадке">
                    <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" fill="none"/>
                        <circle cx="12" cy="12" r="3" fill="currentColor"/>
                    </svg>
                </button>
                <button class="marker-btn real-marker" id="goToRealMarker" title="К правильному месту">
                    <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" stroke="currentColor" stroke-width="2" fill="none"/>
                        <circle cx="12" cy="9" r="3" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="map-float-footer">
            <button class="btn-guess" id="guessBtn" disabled>🎯 Угадать место</button>
            <button class="btn-next" id="nextBtn">Следующий раунд →</button>
        </div>
    </div>

    <script src="https://api-maps.yandex.ru/2.1/?apikey={{ yandex_api_key }}&lang=ru_RU"></script>
    <script>
        const CURRENT_ROUND = {{ round_number }};
        let map = null;
        let panoramaPlayer = null;
        let userMarker = null;
        let realMarker = null;
        let userCoords = null;
        let realCoords = null;
        let startCoords = null;
        let locationId = null;
        let roundCompleted = false;
        let mapExpanded = false;
        let mapCollapsed = false;

        const mapFloat  = document.getElementById('mapFloat');
        const expandBtn = document.getElementById('expandBtn');
        const collapseBtn = document.getElementById('collapseBtn');
        const guessBtn = document.getElementById('guessBtn');
        const nextBtn = document.getElementById('nextBtn');
        const markerNav = document.getElementById('markerNav');

        // 🧹 Функция очистки маркеров панорамы
        function cleanPanoramaMarkers() {
            if (!panoramaPlayer) return;

            try {
                // Перехватываем методы загрузки новых панорам
                const enginePrototype = Object.getPrototypeOf(panoramaPlayer._engine);

                // Переопределяем методы для очистки маркеров
                enginePrototype._onThoroughfareLoad = function(e) {
                    if (e) {
                        e._markers = [];
                        e._connectionArrows = [];
                    }
                    this.setPanorama(e);
                };

                enginePrototype._onJumpLoad = function(e) {
                    if (e) {
                        e._markers = [];
                        e._connectionArrows = [];
                    }
                    this.setPanorama(e);
                };

                // Очищаем маркеры на текущей панораме
                if (panoramaPlayer._panorama) {
                    panoramaPlayer._panorama._markers = [];
                    panoramaPlayer._panorama._connectionArrows = [];
                }

                // Принудительно обновляем плеер
                if (panoramaPlayer._engine && panoramaPlayer._panorama) {
                    panoramaPlayer._engine.setPanorama(panoramaPlayer._panorama);
                }
            } catch (e) {
                console.warn('Не удалось очистить маркеры панорамы:', e);
            }
        }

        expandBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (mapCollapsed) {
                mapCollapsed = false;
                mapFloat.classList.remove('collapsed');
                updateCollapseIcon();
            }
            mapExpanded = !mapExpanded;
            mapFloat.classList.toggle('expanded', mapExpanded);
            updateExpandIcon();
            setTimeout(() => {
                if (map) map.container.fitToViewport();
            }, 370);
        });

        collapseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            mapCollapsed = !mapCollapsed;
            mapFloat.classList.toggle('collapsed', mapCollapsed);
            if (mapCollapsed) {
                mapExpanded = false;
                mapFloat.classList.remove('expanded');
                updateExpandIcon();
            }
            updateCollapseIcon();
            if (!mapCollapsed) {
                setTimeout(() => {
                    if (map) map.container.fitToViewport();
                }, 370);
            }
        });

        function updateExpandIcon() {
            expandBtn.innerHTML = mapExpanded
                ? `<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                       <path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/>
                   </svg>`
                : `<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                       <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                   </svg>`;
        }

        function updateCollapseIcon() {
            collapseBtn.innerHTML = mapCollapsed
                ? `<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                       <path d="M12 5v14M5 12h14"/>
                   </svg>`
                : `<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                       <path d="M5 12h14"/>
                   </svg>`;
            collapseBtn.title = mapCollapsed ? 'Развернуть' : 'Свернуть';
        }

        function updateMapSize() {
            if (map) {
                setTimeout(() => {
                    map.container.fitToViewport();
                }, 300);
            }
        }

        const resizeObserver = new ResizeObserver(() => {
            updateMapSize();
        });
        resizeObserver.observe(mapFloat);

        function zoomToMarker(coords) {
            if (!map) return;

            const zoomSize = 0.005;
            const bounds = [
                [coords[0] - zoomSize, coords[1] - zoomSize],
                [coords[0] + zoomSize, coords[1] + zoomSize]
            ];

            map.setBounds(bounds, {
                checkZoomRange: true,
                duration: 500
            });

            if (mapCollapsed) {
                mapCollapsed = false;
                mapFloat.classList.remove('collapsed');
                updateCollapseIcon();
            }
        }

        // Кнопка возврата к начальной точке
        document.getElementById('goToStart').addEventListener('click', () => {
            if (startCoords) {
                document.getElementById('pano').innerHTML = '';

                ymaps.panorama.createPlayer('pano', startCoords, {
                    layer: 'yandex#panorama',
                    controls: [],
                    suppressMapOpenBlock: true
                }).then(player => {
                    panoramaPlayer = player;
                    cleanPanoramaMarkers(); // 🧹 Очищаем маркеры
                }).catch(() => {
                    ymaps.panorama.locate(startCoords).then(panoramas => {
                        if (panoramas.length) {
                            panoramaPlayer = new ymaps.panorama.Player('pano', panoramas[0], {
                                controls: [],
                                suppressMapOpenBlock: true
                            });
                            cleanPanoramaMarkers(); // 🧹 Очищаем маркеры
                        }
                    });
                });
            }
        });

        document.getElementById('goToUserMarker').addEventListener('click', () => {
            if (userCoords) {
                zoomToMarker(userCoords);
            }
        });

        document.getElementById('goToRealMarker').addEventListener('click', () => {
            if (realCoords) {
                zoomToMarker(realCoords);
            }
        });

        async function findAndLoadPanorama(lat, lon, attempt = 1) {
            const MAX = 15;
            document.getElementById('attemptCounter').textContent =
                attempt > 1 ? `Попытка ${attempt} из ${MAX}` : '';

            try {
                const panoramas = await ymaps.panorama.locate([lat, lon]);
                if (!panoramas.length) throw new Error('Нет панорамы');

                const pano = panoramas[0];
                const coords = pano.getPosition();

                // Отсекаем высоту (третий элемент)
                const cleanCoords = [coords[0], coords[1]];

                startCoords = [cleanCoords[0], cleanCoords[1]];

                const r = await fetch('/save_panorama', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lat: cleanCoords[0], lon: cleanCoords[1] })
                });
                locationId = (await r.json()).location_id;

                try {
                    panoramaPlayer = await ymaps.panorama.createPlayer('pano', cleanCoords, {
                        layer: 'yandex#panorama', controls: [], suppressMapOpenBlock: true
                    });
                } catch {
                    panoramaPlayer = new ymaps.panorama.Player('pano', pano, { controls: [], suppressMapOpenBlock: true });
                }

                // 🧹 Очищаем маркеры после создания плеера
                cleanPanoramaMarkers();

                // Добавляем обработчик на случай, если плеер пересоздается
                panoramaPlayer.events.add('panoramachange', function() {
                    setTimeout(cleanPanoramaMarkers, 100);
                });

                realCoords = cleanCoords;
                document.getElementById('loadingOverlay').style.display = 'none';

            } catch {
                if (attempt < MAX) {
                    document.getElementById('loadingText').textContent = 'Ищем другое место';
                    await new Promise(r => setTimeout(r, 800));
                    return findAndLoadPanorama(
                        55.55 + Math.random() * 0.4,
                        37.35 + Math.random() * 0.55,
                        attempt + 1
                    );
                } else {
                    document.getElementById('loadingText').textContent = 'Загружаем запасной вид';
                    const fb = [55.753544, 37.621202];
                    realCoords = fb;
                    startCoords = [fb[0], fb[1]];
                    const r = await fetch('/save_panorama', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ lat: fb[0], lon: fb[1] })
                    });
                    locationId = (await r.json()).location_id;
                    panoramaPlayer = await ymaps.panorama.createPlayer('pano', fb, {
                        layer: 'yandex#panorama', controls: [], suppressMapOpenBlock: true
                    });

                    // 🧹 Очищаем маркеры для запасного вида
                    cleanPanoramaMarkers();
                    panoramaPlayer.events.add('panoramachange', function() {
                        setTimeout(cleanPanoramaMarkers, 100);
                    });

                    document.getElementById('loadingOverlay').style.display = 'none';
                }
            }
        }

        function showResult(distanceKm, score, isSurprise, actualCity) {
            const accuracy = Math.max(0, 100 - (distanceKm / 10) * 100).toFixed(1);

            let emoji, title, scoreText, labelText;

            if (isSurprise) {
                if (score === 52000) {
                    emoji = '🏆🏆🏆';
                    title = 'НЕВЕРОЯТНО! ДЖЕКПОТ!';
                    scoreText = '52 000';
                    labelText = 'очков за раунд';
                } else {
                    emoji = '🤯';
                    title = `УПС! ЭТО ${actualCity.toUpperCase()}!`;
                    scoreText = '🏙️';
                    labelText = 'другой город';
                }
            } else {
                emoji = score === 0 ? '😢' : score >= 4000 ? '🎯' : score >= 2000 ? '👍' : '🤷';
                title = score === 0 ? 'МИМО!' : score >= 4000 ? 'ОТЛИЧНО!' : score >= 2000 ? 'НЕПЛОХО!' : 'ПРОДОЛЖАЙ!';
                scoreText = '+' + score;
                labelText = 'очков за раунд';
            }

            document.getElementById('resultEmoji').textContent = emoji;
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultScore').textContent = scoreText;
            document.getElementById('resultScore').style.fontSize = (isSurprise && score === 52000) ? '48px' : '76px';
            document.getElementById('resultScoreLabel').textContent = labelText;
            document.getElementById('resultDist').textContent = distanceKm.toFixed(2) + ' км';
            document.getElementById('resultAccuracy').textContent = accuracy + '%';
            document.getElementById('resultOverlay').classList.add('visible');
        }

        function closeResult() {
            document.getElementById('resultOverlay').classList.remove('visible');
            if (mapCollapsed) {
                mapCollapsed = false;
                mapFloat.classList.remove('collapsed');
                updateCollapseIcon();
            }
            if (!mapExpanded) {
                mapExpanded = true;
                mapFloat.classList.add('expanded');
                updateExpandIcon();
            }
            setTimeout(() => {
                if (map) map.container.fitToViewport();
            }, 370);
        }

        function submitGuess() {
            if (!userCoords || roundCompleted) return;
            roundCompleted = true;

            if (mapCollapsed) {
                mapCollapsed = false;
                mapFloat.classList.remove('collapsed');
                updateCollapseIcon();
            }

            fetch('/submit_guess', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    guess_lat: userCoords[0],
                    guess_lon: userCoords[1]
                })
            })
            .then(r => r.json())
            .then(data => {
                const realCoordsFromServer = [data.real_lat, data.real_lon];

                realMarker = new ymaps.Placemark(realCoordsFromServer, {
                    hintContent: 'Правильное место',
                    balloonContent: '📍 Правильное место'
                }, {
                    preset: 'islands#greenIcon',
                    iconColor: '#3fb950'
                });

                realMarker.events.add('click', function() {
                    zoomToMarker(realCoordsFromServer);
                });

                map.geoObjects.add(realMarker);

                map.geoObjects.add(new ymaps.Polyline(
                    [userCoords, realCoordsFromServer], {}, {
                        strokeColor: '#f0a500',
                        strokeWidth: 3,
                        strokeOpacity: 0.9,
                        strokeStyle: 'dash'
                    }
                ));

                if (userMarker) {
                    userMarker.options.set('iconColor', '#f85149');
                    userMarker.properties.set('hintContent', 'Ваша догадка');
                    userMarker.properties.set('balloonContent', '🎯 Ваша догадка');

                    userMarker.events.remove('click');
                    userMarker.events.add('click', function() {
                        zoomToMarker(userCoords);
                    });
                }

                const bounds = map.geoObjects.getBounds();
                if (bounds) {
                    map.setBounds(bounds, { zoomMargin: 50, checkZoomRange: true });
                }

                document.getElementById('totalScore').textContent = data.total_score;

                showResult(data.distance_km, data.round_score, data.is_surprise, data.actual_city);

                guessBtn.style.display = 'none';
                nextBtn.style.display = 'block';

                markerNav.classList.add('visible');

                const isLast = CURRENT_ROUND >= 5;
                nextBtn.textContent = isLast ? '🏁 Завершить игру' : '➡️ Следующий раунд';
                if (isLast) nextBtn.classList.add('finish');

                nextBtn.onclick = () => {
                    window.location.href = isLast ? '/game_over' : '/game';
                };
            })
            .catch(error => {
                console.error('Ошибка:', error);
                alert('Произошла ошибка при отправке результата');
                roundCompleted = false;
            });
        }

        guessBtn.onclick = submitGuess;

        ymaps.ready(async () => {
            map = new ymaps.Map('map', {
                center: [55.76, 37.64],
                zoom: 10,
                controls: []
            });

            map.events.add('click', (e) => {
                if (roundCompleted) return;
                userCoords = e.get('coords');
                if (userMarker) {
                    userMarker.geometry.setCoordinates(userCoords);
                } else {
                    userMarker = new ymaps.Placemark(userCoords, {
                        hintContent: 'Ваша догадка',
                        balloonContent: '🎯 Ваша догадка'
                    }, {
                        preset: 'islands#redIcon',
                        iconColor: '#f85149'
                    });
                    map.geoObjects.add(userMarker);
                }
                guessBtn.disabled = false;
                document.getElementById('mapHint').style.opacity = '0';
            });

            await findAndLoadPanorama({{ search_lat }}, {{ search_lon }});

            setTimeout(() => {
                updateMapSize();
            }, 100);
        });
    </script>
</body>
</html>
