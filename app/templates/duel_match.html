<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>МосGuessr — Дуэль</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #1c2333;
            --border: rgba(255,255,255,0.12);
            --accent: #f0a500;
            --accent2: #e05a2b;
            --text: #e6edf3;
            --muted: #8b949e;
            --green: #3fb950;
            --red: #f85149;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        #pano {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .topbar-left { display: flex; align-items: center; gap: 12px; }

        .logo-text {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            letter-spacing: 4px;
            color: var(--text);
        }

        .logo-text span { color: var(--accent2); }

        .round-pill {
            background: rgba(224,90,43,0.15);
            border: 1px solid rgba(224,90,43,0.3);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent2);
        }

        .timer-pill {
            border-radius: 20px;
            padding: 4px 16px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            letter-spacing: 2px;
        }

        .timer-pill.safe { background: var(--green); color: #0d1117; }
        .timer-pill.warn { background: var(--accent); color: #0d1117; }
        .timer-pill.danger { background: var(--red); color: #fff; }

        .scores-pill {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 4px 16px;
            font-size: 13px;
            font-weight: 600;
        }

        .opponent-status {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 101;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .opponent-status.thinking { color: var(--muted); }
        .opponent-status.answered { color: var(--green); border-color: rgba(63,185,80,0.3); }
        .opponent-status.waiting { color: var(--accent); }

        .map-float {
            position: fixed;
            top: 100px;
            right: 20px;
            z-index: 200;
            width: 350px;
            height: 280px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 48px rgba(0,0,0,0.65);
        }

        .map-float-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .map-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--accent2);
        }

        .map-float-title {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 600;
        }

        #map {
            flex: 1;
            min-height: 0;
            cursor: crosshair;
        }

        .map-float-footer {
            padding: 0 14px;
            height: 60px;
            background: var(--surface2);
            border-top: none;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-guess {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--accent2);
            color: #fff;
            transform: translateY(-12px);
        }

        .btn-guess:hover:not(:disabled) {
            background: #ff6b3d;
            transform: translateY(-14px);
            box-shadow: 0 4px 12px rgba(224,90,43,0.4);
        }

        .btn-guess:disabled {
            background: rgba(22,27,34,0.82);
            color: var(--muted);
            border: 1px solid var(--border);
            cursor: not-allowed;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.visible { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateY(20px);
            transition: transform 0.3s cubic-bezier(.4,0,.2,1);
        }

        .modal-overlay.visible .modal-card { transform: translateY(0); }

        .modal-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            letter-spacing: 3px;
            margin-bottom: 16px;
            text-align: center;
        }

        #resultMap {
            width: 100%;
            height: 300px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .scores-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .scores-table th {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .scores-table td {
            padding: 12px;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
        }

        .scores-table .score-high { color: var(--green); font-weight: 700; }
        .scores-table .score-med { color: var(--accent); font-weight: 700; }

        .btn-next, .btn-finish, .btn-menu {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
        }

        .btn-next {
            background: var(--accent2);
            color: #fff;
        }

        .btn-next:hover:not(:disabled) {
            background: #ff6b3d;
        }

        .btn-next:disabled {
            background: var(--surface2);
            color: var(--muted);
            cursor: not-allowed;
        }

        .btn-finish {
            background: var(--accent);
            color: #0d1117;
        }

        .btn-finish:hover {
            background: #ffb930;
        }

        .btn-menu {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }

        .btn-menu:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .return-to-start {
            position: fixed;
            bottom: 0;
            right: 0;
            z-index: 250;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-right: none;
            border-bottom: none;
            border-radius: 12px 0 0 0;
            color: var(--accent);
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.3);
        }

        .return-to-start:hover {
            background: var(--surface);
            border-color: var(--accent);
            color: #ffb930;
            padding-right: 28px;
        }

        .return-to-start svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        @media (max-width: 600px) {
            .map-float {
                top: 100px;
                right: 10px;
                left: 10px;
                width: auto;
                height: 240px;
            }
        }
    </style>
</head>
<body>

    <div id="pano"></div>

    <div class="topbar">
        <div class="topbar-left">
            <div class="logo-text">Мос<span>Guessr</span></div>
            <div class="round-pill" id="roundPill">Раунд 1/5</div>
            <div class="timer-pill safe" id="timerPill">60</div>
        </div>
        <div>
            <span class="scores-pill">🏆 <span id="myScore">0</span> | 🏆 <span id="opponentScore">0</span></span>
        </div>
    </div>

    <div class="opponent-status thinking" id="opponentStatus">Соперник думает...</div>

    <div class="map-float">
        <div class="map-float-header">
            <div class="map-dot"></div>
            <div class="map-float-title">Выберите место</div>
        </div>
        <div id="map"></div>
        <div class="map-float-footer">
            <button class="btn-guess" id="guessBtn" disabled>🎯 Угадать</button>
        </div>
    </div>

    <!-- Модалка результатов раунда -->
    <div class="modal-overlay" id="roundModal">
        <div class="modal-card">
            <div class="modal-title" id="roundModalTitle">Результаты раунда</div>
            <div id="resultMap"></div>
            <div id="scoresTableContainer"></div>
            <button class="btn-next" id="nextRoundBtn" onclick="goNextRound()">Следующий раунд →</button>
        </div>
    </div>

    <!-- Модалка завершения дуэли -->
    <div class="modal-overlay" id="finishModal">
        <div class="modal-card">
            <div class="modal-title" id="finishTitle">🏆 Дуэль завершена!</div>
            <div id="finishContent" style="text-align:center; margin-bottom:20px;"></div>
            <a href="/duel" class="btn-finish" style="display:block;text-align:center;text-decoration:none;">В меню дуэлей</a>
            <a href="/" class="btn-menu" style="display:block;text-align:center;text-decoration:none;">На главную</a>
        </div>
    </div>

    <script src="https://api-maps.yandex.ru/2.1/?apikey={{ yandex_api_key }}&lang=ru_RU"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/duel_match.js') }}"></script>
</body>
</html>
