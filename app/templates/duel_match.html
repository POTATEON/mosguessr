<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>МосGuessr — Дуэль (Создание)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #1c2333;
            --border: rgba(255,255,255,0.12);
            --accent: #f0a500;
            --accent2: #e05a2b;
            --text: #e6edf3;
            --muted: #8b949e;
            --green: #3fb950;
            --red: #f85149;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        #gamePano {
            position: fixed;
            inset: 0;
            z-index: 0;
            display: none;
        }

        #mainMap {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .topbar-left { display: flex; align-items: center; gap: 12px; }

        .logo-text {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            letter-spacing: 4px;
        }

        .logo-text span { color: var(--accent2); }

        .phase-pill {
            background: rgba(240,165,0,0.15);
            border: 1px solid rgba(240,165,0,0.3);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
        }

        .timer-pill {
            border-radius: 20px;
            padding: 4px 16px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            letter-spacing: 2px;
        }

        .timer-pill.safe { background: var(--green); color: #0d1117; }
        .timer-pill.warn { background: var(--accent); color: #0d1117; }
        .timer-pill.danger { background: var(--red); color: #fff; }

        .opponent-status {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 101;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .opponent-status.thinking { color: var(--muted); }
        .opponent-status.answered { color: var(--green); border-color: rgba(63,185,80,0.3); }
        .opponent-status.waiting { color: var(--accent); }

        .pano-preview {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 200;
            width: 380px;
            height: 240px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: none;
            flex-direction: column;
            box-shadow: 0 20px 48px rgba(0,0,0,0.65);
        }

        .pano-preview.visible { display: flex; }

        .pano-preview-header {
            padding: 10px 14px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            flex-shrink: 0;
        }

        .pano-preview-close {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 18px;
            transition: color 0.2s;
            padding: 4px;
        }

        .pano-preview-close:hover { color: var(--accent2); }

        #panoPreview { flex: 1; min-height: 0; }

        .map-float {
            position: fixed;
            top: 140px;
            right: 24px;
            z-index: 200;
            width: 350px;
            height: 280px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: none;
            flex-direction: column;
            box-shadow: 0 20px 48px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.03) inset;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
        }

        .map-float.visible { display: flex; }

        .map-float.hidden { display: none !important; }

        .map-float:hover:not(.collapsed) {
            width: 520px;
            height: 420px;
            box-shadow: 0 28px 60px rgba(240, 165, 0, 0.2), 0 0 0 1px rgba(240, 165, 0, 0.25) inset;
        }

        .map-float.collapsed {
            width: 280px;
            height: 52px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .map-float.collapsed:hover { width: 280px; height: 52px; }

        .map-float.collapsed #guessMap,
        .map-float.collapsed .map-float-footer { display: none; }
        .map-float.collapsed .map-float-hint { display: none; }

        .map-float.expanded {
            width: 720px;
            height: 520px;
            box-shadow: 0 28px 60px rgba(0,0,0,0.75), 0 0 0 1px rgba(240,165,0,0.12) inset;
        }

        .map-float-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            user-select: none;
        }

        .map-float.collapsed .map-float-header { border-bottom: none; }
        .map-float-left { display: flex; align-items: center; gap: 10px; }

        .map-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--accent2);
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .map-float.collapsed .map-dot { opacity: 1; }

        .map-float-title {
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 600;
        }

        .map-float-hint {
            font-size: 10px;
            color: rgba(139,148,158,0.45);
            transition: opacity 0.4s;
        }

        .map-controls { display: flex; align-items: center; gap: 6px; }

        .map-collapse-btn,
        .map-expand-btn {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .map-collapse-btn:hover,
        .map-expand-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(240,165,0,0.07);
        }

        .map-float.collapsed .map-collapse-btn { display: none; }

        .map-container {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
        }

        #guessMap, #map { width: 100%; height: 100%; cursor: crosshair; }

        .map-overlay-curtain {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: var(--surface2);
            pointer-events: auto;
            z-index: 3;
            border-top: 1px solid var(--border);
        }

        .map-float-footer {
            padding: 0 14px;
            height: 64px;
            background: var(--surface2);
            border-top: none;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            z-index: 4;
            margin-top: -12px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            transform: translateY(-16px);
        }

        .btn-guess { background: var(--accent2); color: #fff; }

        .btn-guess:hover:not(:disabled) {
            background: #ff6b3d;
            transform: translateY(-18px);
            box-shadow: 0 4px 12px rgba(224,90,43,0.4);
        }

        .btn-guess:disabled {
            background: rgba(22,27,34,0.82);
            color: var(--muted);
            border: 1px solid var(--border);
            cursor: not-allowed;
            transform: translateY(-16px);
        }

        .confirm-btn-float {
            position: fixed;
            bottom: 40px;
            right: 40px;
            z-index: 250;
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            background: var(--green);
            color: #0d1117;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 24px rgba(63,185,80,0.3);
        }

        .confirm-btn-float:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(63,185,80,0.5);
        }

        .confirm-btn-float:disabled {
            background: var(--surface2);
            color: var(--muted);
            border: 1px solid var(--border);
            cursor: not-allowed;
            box-shadow: none;
        }

        .go-to-start-btn {
            position: fixed;
            bottom: 40px;
            left: 40px;
            z-index: 250;
            padding: 12px 24px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface2);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0;
            pointer-events: none;
        }

        .go-to-start-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .go-to-start-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.visible { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            max-width: 750px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-align: center;
        }

        .results-maps-row { display: flex; gap: 16px; margin-bottom: 16px; }

        .result-map-col { flex: 1; display: flex; flex-direction: column; gap: 8px; }

        .result-map-label {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 600;
            text-align: center;
        }

        .result-map-label.enemy { color: var(--red); }
        .result-map-label.mine { color: var(--green); }

        .result-map-mini {
            width: 100%;
            height: 220px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .scores-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }

        .scores-table th {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .scores-table td { padding: 12px; font-size: 13px; border-bottom: 1px solid var(--border); }
        .scores-table .score-high { color: var(--green); font-weight: 700; }
        .scores-table .score-med { color: var(--accent); font-weight: 700; }

        .btn-next {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--accent2);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-next:hover:not(:disabled) { background: #ff6b3d; }
        .btn-next:disabled {
            background: var(--surface2);
            color: var(--muted);
            cursor: not-allowed;
        }

        @media (max-width: 650px) {
            .results-maps-row { flex-direction: column; }
            .result-map-mini { height: 180px; }
            .map-float { top: 140px; right: 12px; left: 12px; width: auto; height: 220px; }
            .map-float:hover:not(.collapsed) { width: auto; height: 320px; }
            .map-float.collapsed { width: auto; height: 52px; }
            .map-float.expanded { top: 140px; right: 12px; left: 12px; width: auto; height: 50vh; }
            .pano-preview { left: 10px; right: 10px; width: auto; height: 180px; }
            .confirm-btn-float { bottom: 20px; right: 20px; padding: 12px 24px; }
            .go-to-start-btn { bottom: 20px; left: 20px; padding: 10px 20px; }
        }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="topbar-left">
            <div class="logo-text">Мос<span>Guessr</span></div>
            <div class="phase-pill" id="phasePill">Выберите точку</div>
        </div>
        <div class="timer-pill safe" id="timerPill">45</div>
    </div>

    <div class="opponent-status thinking" id="opponentStatus">
        Соперник выбирает...
    </div>

    <div id="mainMap"></div>
    <div id="gamePano"></div>

    <div class="pano-preview" id="panoPreviewBox">
        <div class="pano-preview-header">
            <span>Предпросмотр</span>
            <button class="pano-preview-close" onclick="closePanoPreview()">✕</button>
        </div>
        <div id="panoPreview"></div>
    </div>

    <!-- Карта для выбора точки (фаза creating) -->
    <div class="map-float visible" id="selectMapFloat">
        <div class="map-float-header">
            <div class="map-float-left">
                <div class="map-dot"></div>
                <div class="map-float-title">Карта Москвы</div>
            </div>
            <div class="map-float-hint" id="selectMapHint">Кликните, чтобы выбрать место</div>
            <div class="map-controls">
                <button class="map-collapse-btn" id="selectCollapseBtn" title="Свернуть">
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path d="M5 12h14"/>
                    </svg>
                </button>
                <button class="map-expand-btn" id="selectExpandBtn" title="Развернуть">
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="map-container">
            <div id="map"></div>
            <div class="map-overlay-curtain"></div>
        </div>
        <div class="map-float-footer">
            <!-- Кнопка подтверждения теперь общая снизу -->
        </div>
    </div>

    <!-- Карта для угадывания (фаза guessing) -->
    <div class="map-float hidden" id="guessMapFloat">
        <div class="map-float-header">
            <div class="map-float-left">
                <div class="map-dot"></div>
                <div class="map-float-title">Ваша догадка</div>
            </div>
            <div class="map-float-hint" id="guessMapHint">Отметьте догадку</div>
            <div class="map-controls">
                <button class="map-collapse-btn" id="guessCollapseBtn" title="Свернуть">
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path d="M5 12h14"/>
                    </svg>
                </button>
                <button class="map-expand-btn" id="guessExpandBtn" title="Развернуть">
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="map-container">
            <div id="guessMap"></div>
            <div class="map-overlay-curtain"></div>
        </div>
        <div class="map-float-footer">
            <button class="btn btn-guess" id="guessBtn" disabled onclick="submitGuess()">
                🎯 Угадать
            </button>
        </div>
    </div>

    <button class="confirm-btn-float" id="confirmBtn" disabled onclick="confirmLocation()">
        ✅ Подтвердить точку
    </button>

    <button class="go-to-start-btn" id="goToStart">
        ↩ К начальной точке
    </button>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div class="modal-title" id="resultTitle">Результаты раунда</div>
            <div class="results-maps-row" id="resultsMapsRow">
                <div class="result-map-col">
                    <div class="result-map-label enemy">Локация соперника</div>
                    <div class="result-map-mini" id="enemyResultMap"></div>
                </div>
                <div class="result-map-col">
                    <div class="result-map-label mine">Твоя локация</div>
                    <div class="result-map-mini" id="myResultMap"></div>
                </div>
            </div>
            <div id="scoresTableContainer"></div>
            <button class="btn-next" id="nextRoundBtn" onclick="goNextRound()">
                Следующий раунд →
            </button>
        </div>
    </div>

    <script src="https://api-maps.yandex.ru/2.1/?apikey={{ yandex_api_key }}&lang=ru_RU"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        // 🔥 Глобальные переменные, нужные для duel_create.js
        const socket = io();
        const duelId = parseInt(sessionStorage.getItem('duel_id'));
        const opponentName = sessionStorage.getItem('opponent_name') || 'Соперник';
        const myUserId = parseInt(sessionStorage.getItem('my_user_id'));

        console.log(`[CREATE] Duel ${duelId}, User ${myUserId}`);

        if (!duelId || !myUserId) {
            alert('Ошибка: данные дуэли не найдены. Вернитесь в меню.');
            window.location.href = '/duel';
        }

        socket.emit('join_creator_duel', { duel_id: duelId });
    </script>
    <script src="{{ url_for('static', filename='js/duel_create.js') }}"></script>
</body>
</html>
