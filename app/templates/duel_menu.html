<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МосGuessr — Дуэль</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='tab_icons/duel.ico') }}?v=1" type="image/x-icon">
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #1c2333;
            --border: rgba(255,255,255,0.08);
            --accent: #f0a500;
            --accent2: #e05a2b;
            --text: #e6edf3;
            --muted: #8b949e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(240,165,0,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(240,165,0,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: -20%;
            right: -10%;
            width: 70%;
            height: 70%;
            background: radial-gradient(ellipse, rgba(224,90,43,0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .container {
            max-width: 520px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(40px, 10vw, 64px);
            line-height: 0.9;
            letter-spacing: 3px;
            color: var(--text);
        }

        .logo-title span { color: var(--accent2); }

        .logo-sub {
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 8px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .card-header {
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            padding: 20px 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-header-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent2);
        }

        .card-header h3 {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 600;
        }

        .card-body {
            padding: 28px;
        }

        .card-body p {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn-queue {
            background: var(--accent2);
            color: #fff;
        }

        .btn-queue:hover {
            background: #ff6b3d;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(224,90,43,0.4);
        }

        .btn-lobby {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-lobby:hover {
            border-color: var(--accent2);
            color: var(--accent2);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 16px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent2);
        }

        .input-group input::placeholder {
            color: rgba(139,148,158,0.5);
        }

        .input-group .btn {
            width: auto;
            margin-bottom: 0;
            padding: 12px 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-title">Мос<span>Guessr</span></div>
            <div class="logo-sub">Дуэльный режим</div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-header-dot"></div>
                <h3>⚔️ Сражение с соперником</h3>
            </div>
            <div class="card-body">
                <p>Соревнуйтесь с другим игроком в реальном времени. Угадывайте локации быстрее и точнее соперника, чтобы победить!</p>

                <a href="{{ url_for('game.duel_queue') }}" class="btn btn-queue">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    Быстрый поиск
                </a>
                <a href="{{ url_for('game.duel_create_queue') }}" class="btn btn-lobby" style="background: #9b59b6; border-color: #9b59b6; color: white;">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                    Создать панораму
                </a>

                <div class="divider"><span>или</span></div>

                <button class="btn btn-lobby" onclick="createLobby()">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Игра с другом
                </button>

                <div class="input-group">
                    <input type="text" id="lobbyIdInput" placeholder="Введите ID лобби">
                    <button class="btn btn-lobby" onclick="joinLobby()" style="width:auto;margin-bottom:0;padding:12px 20px;">Войти</button>
                </div>
            </div>
        </div>

        <a href="{{ url_for('index') }}" class="btn btn-secondary">← На главную</a>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = io();

        function createLobby() {
            socket.emit('create_lobby');
        }

        function joinLobby() {
            const lobbyId = document.getElementById('lobbyIdInput').value.trim();
            if (lobbyId) {
                window.location.href = '/duel/lobby/' + lobbyId;
            } else {
                alert('Введите ID лобби');
            }
        }

        socket.on('lobby_created', function(data) {
            window.location.href = '/duel/lobby/' + data.lobby_id;
        });
    </script>
</body>
</html>
